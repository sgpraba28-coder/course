<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    *{
        padding: 0px;
        margin: 0px;
        box-sizing: border-box;
    }
    h1{
        background-color: navy;
        padding: 20px;
        text-align: center;
        color: bisque;
    }
    nav{
        background-color: aqua;
        text-align: center;
        padding: 25px;
        color: black;
    }
    .main{
        background-color: aquamarine;
        height: 85vh;
        width: 100%;
        display: flex;
    }
    .left-main{
        
        width:100% ;
        height: 50%;
        background-color: blueviolet;
    }
    section{
        height: 50%;
        width: 100%;
        background-color: rgb(255, 226, 205);
    }
    article{
        height: 50%;
        width: 100%;
        background-color: rgb(0, 255, 0);
    }
    .right-main{
        height:50% ;
        width: 100%;
        background-color: peru;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    aside{
        height: 90%;
        width: 90%;
        display: flex;
        justify-content: center;
        align-items: center;
    }
    footer{
        background-color: rgb(255, 0, 157);
        text-align: center;
        padding: 30px;
        color: aliceblue;
    }
</style>
<body>
    <h1>heading</h1>
    <nav>navigation</nav>
    <div class="main">
        <div class="left-main">
            <section></section>
        <article></article>
        </div>
        
        <div class="right-main">
            <aside></aside>
        </div>

    </div>
        
    </main>
    <footer>FOOTER</footer>
</body>
</html>
