<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>Document</title>
    <style>
        *,
        *::after,
        *::before {
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }
        nav{
            width:100%;
            height:10vh;
            background-color:rgba(51, 51, 51);
            display: flex;
            justify-content:space-around;
            align-items: center;
            position: relative;

        }
        .logo{
            /* background-color: aqua; */
            width:300px;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            font-weight: 400;
            margin-left: 40px;
            color:white;
            
        }
        .ul{
           
            padding:5px;
            display: flex;
            align-items: center;
            justify-content: center;
            width:700px;
            height: 100%;
            
        }
        .li{
           /* background-color: blueviolet; */
           margin-left:20px;
           list-style-type: none;
           padding:5px 15px;

        }
        .link{
            text-decoration: none;
            color: white;
            /* background-color: rgb(255, 225, 127); */
            font-size: 23px;
            position: relative;
        }
        .link::before{
            content: "";
            background-color:whitesmoke;
            display:inline-block;
            width:100%;
            height:2px;
            position:absolute;
            bottom:-10px;
            width:0%;
            transition: all 0.5S linear 0s;

        }
        .link:hover::before{
            width:100%;
        }
        span{
               /* background-color: white; */
               width:50px;
               height:50px;
               display: flex;
               justify-content: center;
               align-items: center;
               display: none;
            }
            #img{
                width:50px;
                height:50px;
            }
            @media screen and (max-width:640px){
                 nav{
                    position: relative;
                 }
                 .ul{
                    position: absolute;
                    top:10vh;
                    width:100%;
                    display: block;
                    height: auto;
                    background-color: grey;
                    left:-100%;
                    transition: all 0.5s linear 0s;
                 }
                 .li{
                    /* background-color: blue; */
                    /* border: 2px solid white; */
                    text-align: left;
                 }
                 span{
                    display: flex;
                    color: whitesmoke;
                    font-size: 32px;
                 }
                 .logo{
                    width:150px;
                    /* background-color: aqua; */
                    margin-left: 30px;
                    justify-content: start;
                 }
            }
      
    </style>
</head>
<body>
    <nav>
        <div class="logo">
            GFG
        </div>
        <ul class="ul" id = "ul">
            <li class="li"><a href="" class="link">Home</a></li>
            <li class="li"><a href="" class="link">About</a></li>
            <li class="li"><a href="" class="link">Serivces</a></li>
            <li class="li"><a href="" class="link">Contact</a></li>
        </ul>

        <span><i class="fa-solid fa-bars" onclick="toggle()"></i></span>
        <script>
               let toggled = false;

               function toggle(){
                     if (!toggled){
                        toggled = true;
                        document.getElementById("ul").style.left = "0%";
                        return                         
                    }
                    if(toggled){
                        toggled = false;
                        document.getElementById("ul").style.left = "-100%";
                        return
                     }
               }
        </script>
    </nav>
       
</body>

</html>
