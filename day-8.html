<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *,
        * {
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }

        header {
            background-color: navy;
            padding: 15px;
            text-align: center;
            color: white;
            font-size: 32px;
        }

        nav {
            background-color: black;
            color: whitesmoke;
            text-align: center;
            padding: 15px;
        }

        main {
            background-color: red;
            width: 100%;
            height: 85vh;
            display: flex;
        }

        .left-main {
            width: 50%;
            height: 100%;
            background-color: beige;
        }

        section {
            width: 100%;
            height: 50%;
            background-color: rgb(112, 6, 129);
        }

        article {
            width: 100%;
            height: 50%;
            background-color: rgb(100, 129, 6);
        }

        aside {
            width: 90%;
            height: 90%;
            background-color: rgb(129, 6, 104);
        }

        footer {
            background-color: black;
            padding: 20px;
            font-size: 25px;
            text-align: center;
            color: whitesmoke;
        }

        .right-main {
            width: 50%;
            height: 100%;
            background-color: rgb(226, 226, 6);
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>

<body>
    <header>Header</header>
    <nav>Navigation</nav>
    <style>

    </style>
    <main>
        <div class="left-main">
            <section></section>
            <article></article>
        </div>
        <div class="right-main">
            <aside></aside>
        </div>
    </main>
    <footer>Footer</footer>

</body>

</html>
