<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EduTech Responsive Design</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
      }

      body {
        background-color: #f4f6ff;
        padding: 30px 0;
      }

      .main-box {
        max-width: 1200px;
        width: 90%;
        margin: auto;
        padding: 30px;
        display: flex;
        align-items: center;
        gap: 30px;
        background-color: white;
        border-radius: 15px;
        box-shadow: 0 10px 30px #d5dcf5;
      }

      .content {
        width: 60%;
      }

      .welcome {
        display: inline-block;
        background-color: #e1edff;
        color: #0860d7;
        padding: 8px 14px;
        border-radius: 20px;
        font-size: 14px;
        margin-bottom: 20px;
      }

      h1 {
        font-size: 42px;
        color: #061a49;
        margin-bottom: 15px;
      }

      .description {
        color: #39445b;
        font-size: 18px;
        line-height: 1.5;
        margin-bottom: 20px;
      }

      .buttons {
        display: flex;
        gap: 12px;
        margin-bottom: 35px;
      }

      .btn {
        padding: 14px 20px;
        border: 2px solid #0865ee;
        border-radius: 8px;
        font-size: 16px;
        font-weight: bold;
        text-align: center;
        cursor: pointer;
      }

      .start {
        background-color: skyblue;
        color: white;
      }

      .watch {
        background-color: white;
        color: peru;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }

      .play-icon {
        width: 18px;
        height: 18px;
        background-color: pink;
        color: white;
        border-radius: 50%;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 10px;
        flex-shrink: 0;
      }

      .stats {
        display: flex;
        justify-content: space-between;
        text-align: center;
        gap: 10px;
      }

      .stat {
        width: 33.33%;
        border-right: 1px solid #d8deea;
      }

      .stat:last-child {
        border-right: none;
      }

      .stat h2 {
        color: #0865ee;
        font-size: 26px;
        margin-bottom: 5px;
      }

      .stat p {
        color: #39445b;
        font-size: 14px;
      }

      .image-area {
        width: 40%;
      }

      .image-area img {
        width: 100%;
        height: 390px;
        object-fit: cover;
        border-radius: 12px;
        display: block;
      }

      @media (min-width: 768px) and (max-width: 991px) {
        .main-box {
          width: 90%;
          flex-direction: column;
          align-items: stretch;
          padding: 30px;
        }

        .content {
          width: 100%;
        }

        .image-area {
          width: 100%;
        }

        .image-area img {
          height: 220px;
        }

        h1 {
          font-size: 36px;
        }
      }

      @media (max-width: 767px) {
        body {
          padding: 20px 0;
        }

        .main-box {
          width: 95%;
          flex-direction: column;
          align-items: stretch;
          padding: 20px;
          gap: 25px;
        }

        .content {
          width: 100%;
        }

        .image-area {
          width: 100%;
        }

        h1 {
          font-size: 30px;
        }

        .description {
          font-size: 16px;
        }

        .buttons {
          flex-direction: column;
          gap: 10px;
          margin-bottom: 25px;
        }

        .btn {
          width: 100%;
        }

        .stats {
          gap: 5px;
        }

        .stat h2 {
          font-size: 22px;
        }

        .stat p {
          font-size: 12px;
        }

        .image-area img {
          height: 160px;
        }
      }
    </style>
  </head>

  <body>
    <div class="main-box">
      <div class="content">
        <span class="welcome">Welcome to EduTech</span>
        <h1>Learn Today<br />Build Tomorrow</h1>
        <p class="description">
          Join thousands of students and develop real-world skills with
          expert-led courses.
        </p>
        <div class="buttons">
          <button class="btn start">Get Started &rarr;</button>
          <button class="btn watch">
           <span class="play-icon">&#9654;</span>
            Watch Video
          </button>
        </div>
        <div class="stats">
          <div class="stat">
            <h2>10K+</h2>
            <p>Students</p>
          </div>
          <div class="stat">
            <h2>50+</h2>
            <p>Courses</p>
          </div>
          <div class="stat">
            <h2>95%</h2>
            <p>Success Rate</p>
          </div>
        </div>
      </div>
      <div class="image-area">
        <img src="./Assets/laptop img.jpeg" alt="Online Learning" />
      </div>
    </div>
  </body>
</html>
