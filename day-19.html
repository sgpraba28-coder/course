<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0px;
        padding: 0px;
        box-sizing: border-box;
      }
      nav {
        width: 100%;
        height: 10vh;
        background-color: rgb(21, 17, 230);
        display: flex;
        justify-content: space-around;
        background: linear-gradient(to right,yellow,purple,red);
      }
      .logo {
        margin: 20px 30px 20px 30px;
        width: 300px;
        height: 100%;
        display: flex;
        text-align: center;
        color: white;
        font-weight: 800;
        font-style: bold;
        text-transform: uppercase;
      }

      .ul {
        padding: 5px;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 700px;
        height: 100%;
      }
      .li {
        margin: 15px;
        list-style-type: none;
        color: white;
        padding: 25px 30px;
        text-decoration: none;
      }
      .link {
        text-decoration: none;
        text-align: center;
        color: black;
        font-weight: 200;
        font-size: smaller;
        background-color: aqua;
      }
      h1 {
        color: blue;
        text-align: center;
        padding: 20px;
      }
      h2{
           display: flex;
        justify-content: center;
        align-items: center;
        padding:3px;
      }
      .b1{
        background-color: pink;
        color: white;
        border: 3px solid grey;
        padding: 10px 15px;
        border-radius: 6px;

      }
      .b2{
         background-color: mediumspringgreen;
        color: white;
        border: 3px solid grey;
        padding: 10px 15px;
        border-radius: 6px;
        margin: auto;


      }

     
    </style>
  </head>
  <body>
    <nav>
      <div class="logo">navbar</div>
      <ul class="ul">
        <li class="li"><a href="" class="link">Home</a></li>
        <li class="li"><a href="" class="link">About</a></li>
        <li class="li"><a href="" class="link">Serivces</a></li>
        <li class="li"><a href="" class="link">Contact</a></li>
        <div>
        <button type="button" class="b1">sign in</button>
        </div>
        <div>
        <button type="button" class="b2">sign out</button>
        </div>
      </ul>
    </nav>
    <h1>NAVIGATION BAR</h1>
    <h2>html& css only</h2>
  </body>
</html>
