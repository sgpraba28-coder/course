<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Responsive Layout Task</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
        }

        nav {
            background-color: #222;
            color: white;
            padding: 20px;
            text-align: center;
        }

        header {
            background-color: lightblue;
            padding: 40px;
            text-align: center;
        }

        /* MAIN */
        .main-content {
            width: 1000px;
            margin: 20px auto;
            display: flex;
        }

        /* LEFT */
        .left-content {
            width: 650px;
            background-color: #eee;
            padding: 20px;
        }

        /* RIGHT */
        .right-content {
            width: 350px;
            background-color: #ddd;
            padding: 20px;
        }

        /* SUB BOXES */
        .left-sub-container {
            display: flex;
        }

        .sub-box {
            width: 280px;
            height: 150px;
            background-color: coral;
            margin: 10px;
            padding: 20px;
        }

        .right-sub-box {
            width: 300px;
            height: 320px;
            background-color: lightgreen;
            margin: 10px;
            padding: 20px;
        }

        footer {
            background-color: #222;
            color: white;
            padding: 25px;
            text-align: center;
            margin-top: 20px;
        }

        /* MOBILE */
        @media (max-width: 600px) {

            .main-content {
                width: 100%;
                display: flex;
                flex-direction: column;
            }

            .left-content {
                width: 100%;
            }

            .right-content {
                width: 100%;
            }

            .left-sub-container {
                display: flex;
                flex-direction: column;
            }

            .sub-box {
                width: 100%;
                margin: 10px 0;
            }

            .right-sub-box {
                width: 100%;
                margin: 10px 0;
            }

        }

    </style>
</head>

<body>

    <nav>
        Navigation
    </nav>

    <header>
        Header
    </header>

    <main class="main-content">

        <section class="left-content">

            Left Content

            <div class="left-sub-container">

                <div class="sub-box">
                    Sub Content 1
                </div>

                <div class="sub-box">
                    Sub Content 2
                </div>

            </div>

        </section>

        <section class="right-content">

            Right Content

            <div class="right-sub-box">
                Sub Content
            </div>

        </section>

    </main>

    <footer>
        Footer
    </footer>

</body>
</html>
