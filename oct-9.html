<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }

        .con {
            width: 90%;
            margin: auto;
            background-color: red;
            min-height: 100vh;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            padding: 20px;
        }

        .card {
            width: 18rem;
            background-color: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.3);
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0px 8px 15px rgba(0, 0, 0, 0.4);
        }

        .card-img-top {
            width: 100%;
            height: 200px;
            object-fit: contain;
            background-color: white;
            padding: 10px;
        }

        .card-body {
            padding: 15px;
        }

        .card-title {
            font-size: 20px;
            margin-bottom: 10px;
            color: #222;
        }

        .card-text {
            font-size: 14px;
            color: #555;
            line-height: 1.5;
            margin-bottom: 15px;
        }

        .btn {
            display: inline-block;
            background-color: blue;
            color: white;
            padding: 10px 15px;
            text-decoration: none;
            border-radius: 5px;
        }

        .btn:hover {
            background-color: darkblue;
        }

        @media (max-width: 600px) {
            .con {
                width: 100%;
                padding: 15px;
            }

            .card {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="con" id="con">

    </div>

    <script>
        fetch("https://dummyjson.com/products?limit=5")
            .then(response => response.json())
            .then(data => {

                let text = ''
                console.log(data.products)
                data.products.forEach((value, index, arr) => {
                    text += `
                <div class="card" style="width: 18rem;">
                    <img class="card-img-top" src="${value.images[0]}" alt="Card image cap">
                    <div class="card-body">
                        <h5 class="card-title">${value.title}</h5>
                        <p class="card-text">${value.description}</p>
                        <a href="#" class="btn btn-primary">Go somewhere</a>
                    </div>
                </div>
                    `
                })
                document.getElementById("con").innerHTML = text;
            }

        )
    </script>

</body>

</html>
