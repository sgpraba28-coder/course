<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="./Assets/facebook.jpg" type="image/x-icon" />
    <title>Document</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0 auto;
        width: 800px;
        padding: 20px;
      }

      #title {
        font-size: 35px;
        color: white;
        text-align: end;
        padding: 20px 0;
        background-color: red;
        display: block;
        text-transform: capitalize;
      }

      #container {
        background-color: aqua;
        width: 100%;
      }

      p {
        font-size: 20px;
        color: green;
        padding: 30px;
      }

      #image {
        width: 100%;
        display: block;
      }

      footer {
        display: block;
        width: 100%;
        text-align: center;
        padding: 15px 0;
        background-color: #333;
        color: white;
        text-transform: capitalize;
      }
    </style>
  </head>
  <body>
    <h1 id="title">facebook</h1>
    <div id="container">
      <p>
        <b>Lorem ipsum dolor sit amet consectetur adipisicing elit</b>.
        <i>Reiciendis, voluptas.</i> Earum quis quod possimus, quo fuga dolorem
        officia magnam fugit vero natus, necessitatibus repellat culpa. Culpa
        deleniti maxime fugit ratione?
      </p>
      <img id="image" src="./Assets/bird.jpg" alt="bird" />
    </div>
    <footer>footer-2026</footer>
  </body>
</html>
