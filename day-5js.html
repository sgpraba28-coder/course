<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <style>
    *{
        margin: 0px;
        padding: 0px;
        box-sizing: border-box;
    }
    body{
        background:linear-gradient(to right,pink,white,gold);
    }
    h1{
        font-size: 25px;
        color:goldenrod;
        display: flex;
        justify-content: center;
    }
    .form{ 
      margin: auto;
      height: 50vh;
      width: 30%;
      background-color:blueviolet;
       }
       label{
        display: inline-block;
       }
       input{
        border-radius: 10px;
        margin-bottom: 10px;
       }
       button{
        border-radius: 40px;
        background-color: black;
        color: white;
       }
       .result{
        border-radius: 7px;
        background: papayawhip;
       }
  </style>
  <body>
    <h1>exam calculation</h1>
    <div class="form">
        <label >username:</label>
        <input type="text" id="username"><br>
        <label >moc:</label>
        <input type="number" id="moc"><br>
        <label >hve:</label>
        <input type="number" id="hve"><br>
         <label >oe:</label>
        <input type="number" id="oe"><br>
         <label >aiml:</label>
        <input type="number" id="aiml"><br>
         <label>mc:</label>
        <input type="number" id="mc"><br>
        <button onclick="calculate()"> calc </button>

    </div>

  </body>
  <script>
    function calculate()
    {
        let name=document.getElementById("username").value||0;
        let moc= Number(document.getElementById("moc").value)||0;
        let hve=Number(document.getElementById("hve").value)||0;
        let oe=Number(document.getElementById("oe").value)||0;
        let aiml=Number(document.getElementById("aiml").value)||0;
        let mc=Number(document.getElementById("mc").value)||0;

        let total=moc+hve+oe+aiml+mc;
        let average=total/5;
        let percentage=(total/5)*100;

        let grade="";
        if (percentage>=95){grade ="a+";}
        else if(percentage>=80){grade ="a";}
        else if (percentage>=70){grade ="b+";}
        else if(percentage>=60){grade ="b";}
        else if (percentage>=50){grade ="c";}
        else {grade ="f";}

        console.log("name:"+name);
        console.log("total:"+total);
        console.log("average:"+average);
        console.log("percentage:"+percentage+"%");
        console.log("grade:"+grade);


    }
  </script>
</html>
