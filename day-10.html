<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    *{
        padding: 0px;
        margin: 0px;
        box-sizing: border-box;
        /* overflow: hidden; */
    }
    h1{
        background-color: red;
        text-align: center;
        color: beige;
        padding: 15px 0;
    }
    nav{
        background-color: blueviolet;
        text-align: center;
        padding:15px 0;
        color: aquamarine;
    }
    .main{
        display: flex;
    }
    .left-main{
        background-color: green;
         width: 50%;
        height: 100vh;
    }
    section{
        width: 100%;
        height: 50%;
        background-color: yellow;
    }
    article{
        width: 100%;
        height: 50%;
        background-color: aqua;
    }

    .right-main{
        background-color: pink;
        width: 50%;
        height: 100vh;
        justify-content: center;
        text-align: center;
        display: flex;
    }
    aside{
        background-color:salmon;
        width: 90%;
        height: 90%;
    }
    footer{
        background-color: black;
        text-align: center;
        color: whitesmoke;
        padding: 25px;
    }

</style>
<body>
    <h1>heading</h1>
    <nav>Navigation</nav>
    <div class="main">
        <div class="left-main" >
            <section></section>
            <article></article>
        </div>
        <div class="right-main">
            <aside></aside>
        </div>
    </div>
    <footer>footer</footer>
</body>
</html>
