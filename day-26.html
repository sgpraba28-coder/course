<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }
        .container{
            background-color: aqua;
            width: 100%;
            display: grid;
            grid-template-areas:
            "header header header header"
            "nav nav nav nav"
            "main main main main"
            "article article article article"
            "section section section section"
            "footer footer footer footer"
            ;
            grid-template-rows: 10vh 12vh 45vh 40vh 300px 15vh;
        }
        .sub{
            border: 3px solid peru;
            padding: 15px;
        }
        .header{
            grid-area: header;background-color: brown;
        }
        .nav{grid-area: nav;background-color: aliceblue;}
        .main{grid-area: main;background-color: blanchedalmond;}
        .section{grid-area: section;background-color: blue;}
        .article{grid-area: article;background-color: red;}
        .footer{grid-area: footer;background-color: aquamarine;}

        @media screen and(max-width:430px) {
            .container{
                 grid-template-areas:
            "header header header header"
            "nav nav nav nav"
            "main main main main"
            "section section section section"
            "article article article article"
            "footer footer footer footer"
            ;
            grid-template-rows: 10vh 12vh 45vh 40vh 35vh 15vh;
        }

            }

            
        
    </style>
</head>
    <div class="container">
        <div class="sub header">header</div>
        <div class="sub nav">nav</div>
        <div class="sub three">main</div>
        <div class="sub section">section</div>
        <div class="sub article">article</div>
        <div class="sub footer">footer</div>
    </div>
<body>
    
</body>
</html>
